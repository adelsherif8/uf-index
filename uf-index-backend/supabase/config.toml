# Supabase project config. `project_id` is set by `supabase link`.
project_id = "uf-index"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["exp://", "ufindex://"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false   # true before the pilot goes live

[functions.assessments]
verify_jwt = true

[functions.plus-sessions]
verify_jwt = true
